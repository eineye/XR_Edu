# 정적 웹 데모를 GitHub Pages 에 배포 (서버 없이 브라우저 내장 데모 서버 + 가상 HMD 20대)
# 주소: https://<계정>.github.io/<저장소>/
name: 웹 데모 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 타입 검사
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: 정적 데모 빌드
        working-directory: frontend
        env:
          VITE_DEMO_STATIC: "1"
        run: npx vite build --outDir dist-pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
